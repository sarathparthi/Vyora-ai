version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vyora-postgres
    restart: always
    environment:
      POSTGRES_USER: vyora_admin
      POSTGRES_PASSWORD: vyora_secure_password_2026
      POSTGRES_DB: vyora_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vyora-redis
    restart: always
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vyora-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://vyora_admin:vyora_secure_password_2026@postgres:5432/vyora_db?schema=public"
      JWT_SECRET: "vyora_production_jwt_secret_key_2026"
      JWT_REFRESH_SECRET: "vyora_production_jwt_refresh_secret_key_2026"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vyora-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
    depends_on:
      - backend

volumes:
  pgdata:
